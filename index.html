<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тасиин квест для Егора</title>
<style>
:root{--ink:#3b2840;--cream:#fff7df;--pink:#ef8fa8;--green:#79a86a;--brown:#8b5e4b;--shadow:#5a3d49}
*{box-sizing:border-box} body{margin:0;background:#172b35;font-family:Georgia,serif;color:var(--ink);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:
radial-gradient(circle at 20% 15%,#ffe9a8 0 2px,transparent 3px),
radial-gradient(circle at 80% 25%,#f7c8da 0 2px,transparent 3px),
linear-gradient(#173642,#244f43 55%,#356143);background-size:120px 100px,170px 130px,100% 100%;opacity:.9;z-index:-2}
#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.game{width:min(900px,100%);min-height:650px;background:var(--cream);border:8px solid #6c4b55;border-radius:18px;box-shadow:0 18px 0 #0e2027,0 25px 45px #0008;overflow:hidden;position:relative}
.top{height:70px;background:#9ac37c;border-bottom:5px solid #638b58;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;font-weight:bold}
.hearts{letter-spacing:3px;font-size:20px}.progress{font-size:14px}
.scene{min-height:580px;padding:25px;position:relative;background:linear-gradient(#fff9e8,#f5e6c7)}
.card{max-width:720px;margin:20px auto;background:#fffaf0;border:4px solid #a87365;border-radius:15px;padding:28px;box-shadow:8px 8px 0 #d4ad9a}
h1,h2{margin:0 0 12px} h1{font-size:clamp(28px,6vw,50px)} h2{font-size:clamp(22px,5vw,34px)}
p{font-size:18px;line-height:1.5}.tiny{font-size:13px;opacity:.7}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
button{font:700 17px Georgia,serif;color:var(--ink);background:#f9c7d3;border:4px solid #a45f75;border-radius:11px;padding:14px;cursor:pointer;box-shadow:0 5px 0 #854f62;transition:.12s;position:relative}
button:hover{transform:translateY(-2px)}button:active{transform:translateY(4px);box-shadow:0 1px 0 #854f62}
.start{background:#9ed17f;border-color:#5d8753;box-shadow:0 5px 0 #4c7045}
.character{font-size:85px;text-align:center;filter:drop-shadow(3px 5px 0 #8d5e58);margin:8px}
.dialogue{background:#fff;border:4px solid #6c4b55;border-radius:13px;padding:15px;margin:10px auto;max-width:650px;box-shadow:5px 5px 0 #b98c79}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) scale(.9);background:#3b2840;color:#fff;padding:13px 18px;border-radius:12px;border:3px solid #efb0bd;opacity:0;pointer-events:none;z-index:10;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.explode{animation:explode .55s forwards}@keyframes explode{to{transform:scale(2) rotate(15deg);opacity:0}}
.runaway{position:relative}
.result{background:#fff;border:4px dashed #a87365;padding:20px;border-radius:12px}
ul{line-height:1.8}
.footer{text-align:center;margin-top:18px}
@media(max-width:560px){.game{min-height:100vh;border-width:5px;border-radius:0}.scene{padding:14px}.card{padding:18px}.btns{grid-template-columns:1fr}p{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const questions=[
["🍟","Какие чипсы ты выберешь?","lays","🥔 Lays","pringles","🥫 Pringles","cheetos","🧀 Cheetos","any","🤷 Мне всё равно"],
["🍫","Какая шоколадка?","kinder","🐣 Kinder","snickers","🥜 Snickers","milka","💜 Milka","kitkat","🍪 KitKat"],
["🥤","Что пить под вечерний сериал?","cola","🥤 Кола","juice","🧃 Сок","coffee","☕ Кофе","water","💧 Водичка, я скромный"],
["🍕","Пицца мечты?","pepperoni","🍕 Пепперони","cheese","🧀 4 сыра","mushroom","🍄 Грибная","hawaii","🍍 Гавайская"],
["🍦","Мороженое?","choco","🍫 Шоколадное","strawberry","🍓 Клубничное","cookie","🍪 С печеньем","vanilla","🍦 Ванильное"],
["🍔","Идеальный быстрый перекус?","burger","🍔 Бургер","pizza","🍕 Пицца","nuggets","🍗 Наггетсы","sandwich","🥪 Бутер"],
["🍿","Что брать в кино?","popcorn","🍿 Попкорн","chips","🥔 Чипсы","choco","🍫 Шоколад","all","😎 Всё сразу"],
["☕","Идеальное утро?","sleep","😴 Ещё поспать","coffee","☕ Кофе","food","🥞 Завтрак","cuddle","🫂 Полежать вместе"],
["🎮","После тяжёлого дня хочется…","game","🎮 Поиграть","movie","🎬 Кино","walk","🌙 Погулять","cuddle","💗 Обниматься"],
["🎬","Что включаем вместе?","comedy","😂 Комедию","horror","👻 Ужастик","fantasy","🐉 Фэнтези","anything","🤷 Что-нибудь"],
["🌲","Идеальное свидание?","walk","🌲 Прогулка","restaurant","🍝 Ресторан","home","🏠 Дома","adventure","🗺️ Приключение"],
["🌦️","Какой день тебе больше нравится?","sun","☀️ Солнечный","rain","🌧️ Дождливый","snow","❄️ Снежный","night","🌙 Ночной"],
["🐱","Кто должен жить дома?","cat","🐈 Кот","dog","🐕 Пёс","both","🐈🐕 Оба","me","🧍 Я сам справлюсь"],
["🎁","Какой подарок радует больше?","food","🍫 Что-нибудь вкусное","thing","🎁 Полезная штука","surprise","✨ Сюрприз","letter","💌 Что-то от сердца"],
["💗","Что лучше после плохого дня?","hug","🫂 Обнимашки","food","🍕 Вкусняшка","silence","🛋️ Полежать в тишине","talk","💬 Поговорить"],
["🛋️","Идеальный вечер вдвоём?","movie","🎬 Фильм","games","🎮 Игры","food","🍕 Еда + разговоры","cuddle","💗 Просто рядом"],
["🌍","Куда бы телепортироваться прямо сейчас?","sea","🌊 Море","mountain","⛰️ Горы","city","🌃 Большой город","home","🏠 Домой"],
["💌","Что тебе приятнее получить без повода?","message","💬 Милое сообщение","food","🍫 Любимую вкусняшку","hug","🫂 Объятие","gift","🎁 Подарочек"],
["😈","Кто чаще говорит «давай ещё пять минут»?","me","😇 Я","tasya","💅 Тася","both","😂 Мы оба","unknown","🕵️ Это секрет"],
["❤️","Финальный вопрос. Что тебе важнее всего в отношениях?","trust","🤝 Доверие","humor","😂 Умение смеяться вместе","care","💗 Забота","all","💖 Всё вместе"]
];

let answers={},i=-1,hearts=3,sessionId=crypto.randomUUID?.()||Date.now().toString();
const app=document.querySelector("#app"),toast=document.querySelector("#toast");
function say(t){toast.textContent=t;toast.classList.add("show");clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove("show"),1900)}
function layout(body,progress=""){app.innerHTML=`<main class="game"><header class="top"><span>🌱 ТАСИНО РАССЛЕДОВАНИЕ</span><span class="progress">${progress}</span></header><section class="scene">${body}</section></main>`}
function home(){
layout(`<div class="card" style="text-align:center"><div class="character">👩🏻‍🌾</div><h1>Привет, Егор!</h1><div class="dialogue">Тася нашла очень важную записку. В ней написано: <b>«Надо срочно выяснить, чем кормить Егора и как его правильно обнимать».</b></div><p>Тебя ждёт короткое исследование. Здесь есть обычные вопросы. И несколько ловушек.</p><p class="tiny">Ответы сохраняются. Тася всё увидит. Удачи. 😈</p><button class="start" onclick="start()">НАЧАТЬ КВЕСТ 🌱</button></div>`);
}
function start(){i=0;answers={};hearts=3;renderQ()}
function renderQ(){
let q=questions[i];
layout(`<div class="card"><div class="character">${q[0]}</div><h2>${q[1]}</h2><div class="dialogue">Тася: «Выбирай честно. Я всё равно запомню 👀»</div><div class="btns" id="buttons">
${[2,4,6,8].map(n=>`<button id="b${n}" onclick="choose('${q[n]}','${q[n+1]}',this)">${q[n+1]}</button>`).join("")}</div></div>`,`❤️ ${hearts}  •  ${i+1}/${questions.length}`);
}
function choose(key,label,btn){
let q=questions[i], weird=key;
if((i===0&&key==="any")||(i===1&&key==="any")){ // kept for future custom variants
}
if(i===0 && key==="any"){runaway(btn);return}
if(i===1 && key==="any"){explode(btn);return}
if(i===3 && key==="hawaii"){hearts--;say("Тася молча записала это в блокнот. Очень молча.");}
if(i===6 && key==="all"){say("Амбициозно. Тася одобряет.");hearts=Math.min(5,hearts+1)}
if(i===7 && key==="cuddle"){hearts=Math.min(5,hearts+1);say("🥹 Вот это правильное утро.");}
if(i===8 && key==="cuddle"){hearts=Math.min(5,hearts+1);say("Тася поставила сердечко.");}
if(i===11 && key==="night"){say("🌙 О, у нас тут ночной житель.");}
if(i===14 && key==="hug"){hearts=Math.min(5,hearts+1);say("❤️ +1. Никаких вопросов.");}
if(i===18 && key==="tasya"){hearts=Math.min(5,hearts+1);say("💅 Тася: «Правильный ответ.»");}
answers[i]={question:q[1],value:key,label};
btn.disabled=true;
setTimeout(()=>{i++; i<questions.length?renderQ():finish()},450);
}
function runaway(btn){
say("«Мне всё равно»? КНОПКА С ЭТИМ НЕ СОГЛАСНА.");
btn.classList.add("runaway");
let x=0;const t=setInterval(()=>{x+=1;btn.style.transform=`translate(${Math.sin(x)*110}px,${Math.cos(x*.8)*55}px) rotate(${Math.sin(x)*8}deg)`;if(x>10){clearInterval(t);btn.style.transform="";say("Ладно. Выбирай что-нибудь 😌")}},90)
}
function explode(btn){say("Ты выбрал «любая». Последнее слово было лишним.");btn.classList.add("explode");setTimeout(()=>{btn.classList.remove("explode");btn.textContent="🍫 KITKAT. Я РЕШИЛА.";btn.onclick=()=>choose("kitkat","🍪 KitKat",btn)},600)}
async function finish(){
layout(`<div class="card"><div class="character">💌</div><h1>Расследование завершено!</h1><div class="result"><h2>Отчёт для Таси</h2><p><b>Егор успешно допрошен.</b></p><p>Уровень расположения Таси: ${"❤️".repeat(Math.max(0,Math.min(5,hearts)))}${"🖤".repeat(5-Math.max(0,Math.min(5,hearts)))}</p><p>Ответы аккуратно положены в секретную папку.</p></div><p>Тася: «Спасибо, Егор. Теперь я знаю о тебе немного больше. 💗»</p><div class="footer"><span class="tiny">Можно закрывать игру. Всё уже отправлено.</span></div></div>`);
await save();
}
async function save(){
const payload={session_id:sessionId,name:"Егор",answers,score:hearts,created_at:new Date().toISOString()};
try{
if(window.SUPABASE_URL&&window.SUPABASE_KEY&&window.supabaseClient){
const {error}=await window.supabaseClient.from("quiz_results").insert(payload);
if(error) throw error;
}else{
localStorage.setItem("egor_quiz_last",JSON.stringify(payload));
}
}catch(e){localStorage.setItem("egor_quiz_last",JSON.stringify(payload));console.warn(e)}
}
home();
</script>
<!-- Для облачного сохранения сюда можно подключить Supabase. Без настройки игра всё равно работает и сохраняет ответы в браузере. -->
</body></html>
